<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Battle Arena</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#080b0f;
    font-family:Arial,sans-serif;
    color:white;
}

canvas{
    display:block;
    background:
        linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px),
        #16221a;

    background-size:50px 50px;
}

#menu{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle,#243c2a,#050607 75%);
}

#menu h1{
    font-size:55px;
    letter-spacing:5px;
    text-shadow:0 0 20px #00e5ff;
}

#menu p{
    margin:15px;
    color:#aaa;
    font-size:18px;
}

button{
    border:0;
    padding:16px 55px;
    border-radius:10px;

    background:#ff3d00;
    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

#hud{
    display:none;

    position:fixed;
    top:15px;
    left:15px;

    z-index:5;

    padding:12px 18px;

    background:rgba(0,0,0,.65);
    border-radius:10px;

    font-size:16px;
}

#crosshair{
    display:none;

    position:fixed;
    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:4;

    font-size:28px;
}

#message{
    position:fixed;
    top:100px;
    left:50%;

    transform:translateX(-50%);

    z-index:5;

    font-size:22px;
    font-weight:bold;

    text-shadow:0 0 10px black;
}

</style>
</head>

<body>

<div id="menu">

    <h1>⚡ BATTLE ARENA</h1>

    <p>Mini Battle Royale</p>

    <button onclick="startGame()">
        PLAY NOW
    </button>

    <p>
        WASD / Arrow Keys = Move<br>
        Mouse = Aim<br>
        Left Click = Shoot
    </p>

</div>

<div id="hud">

    ❤️ HP:
    <span id="hp">100</span>

    &nbsp;&nbsp;

    💀 Kills:
    <span id="kills">0</span>

    &nbsp;&nbsp;

    👥 Enemies:
    <span id="enemyCount">8</span>

</div>

<div id="crosshair">+</div>

<div id="message"></div>

<canvas id="game"></canvas>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;


/* =========================
   GAME VARIABLES
========================= */

let gameRunning = false;

let mouseX = canvas.width / 2;
let mouseY = canvas.height / 2;

let kills = 0;

let bullets = [];

let enemies = [];

let particles = [];

let keys = {};


/* =========================
   PLAYER
========================= */

const player = {

    x: canvas.width / 2,

    y: canvas.height / 2,

    radius: 20,

    speed: 5,

    health: 100,

    angle: 0

};


/* =========================
   SAFE ZONE
========================= */

let zone = {

    x: canvas.width / 2,

    y: canvas.height / 2,

    radius: Math.min(
        canvas.width,
        canvas.height
    ) * .42

};


/* =========================
   START GAME
========================= */

function startGame(){

    document.getElementById("menu").style.display="none";

    document.getElementById("hud").style.display="block";

    document.getElementById("crosshair").style.display="block";

    gameRunning=true;

    createEnemies();

    gameLoop();

}


/* =========================
   CREATE ENEMIES
========================= */

function createEnemies(){

    enemies=[];

    for(let i=0;i<8;i++){

        let enemy={

            x:Math.random()*canvas.width,

            y:Math.random()*canvas.height,

            radius:18,

            health:100,

            speed:1+Math.random()*1.5,

            color:"#ff3d3d",

            cooldown:0

        };

        enemies.push(enemy);

    }

}


/* =========================
   KEYBOARD
========================= */

window.addEventListener("keydown",function(e){

    keys[e.key.toLowerCase()]=true;

});


window.addEventListener("keyup",function(e){

    keys[e.key.toLowerCase()]=false;

});


/* =========================
   MOUSE
========================= */

canvas.addEventListener("mousemove",function(e){

    mouseX=e.clientX;

    mouseY=e.clientY;

});


canvas.addEventListener("mousedown",function(e){

    if(e.button===0){

        shoot();

    }

});


/* =========================
   PLAYER MOVEMENT
========================= */

function movePlayer(){

    if(keys["w"] || keys["arrowup"]){

        player.y-=player.speed;

    }

    if(keys["s"] || keys["arrowdown"]){

        player.y+=player.speed;

    }

    if(keys["a"] || keys["arrowleft"]){

        player.x-=player.speed;

    }

    if(keys["d"] || keys["arrowright"]){

        player.x+=player.speed;

    }


    player.x=Math.max(
        player.radius,
        Math.min(
            canvas.width-player.radius,
            player.x
        )
    );


    player.y=Math.max(
        player.radius,
        Math.min(
            canvas.height-player.radius,
            player.y
        )
    );


    player.angle=Math.atan2(

        mouseY-player.y,

        mouseX-player.x

    );

}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!gameRunning)return;


    let speed=12;


    bullets.push({

        x:player.x,

        y:player.y,

        dx:Math.cos(player.angle)*speed,

        dy:Math.sin(player.angle)*speed,

        life:70

    });

}


/* =========================
   UPDATE BULLETS
========================= */

function updateBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        let b=bullets[i];

        b.x+=b.dx;

        b.y+=b.dy;

        b.life--;


        for(let j=enemies.length-1;j>=0;j--){

            let e=enemies[j];


            let distance=Math.hypot(

                b.x-e.x,

                b.y-e.y

            );


            if(distance<e.radius+5){

                e.health-=50;

                createExplosion(e.x,e.y);

                bullets.splice(i,1);


                if(e.health<=0){

                    kills++;

                    document.getElementById(
                        "kills"
                    ).innerText=kills;

                    enemies.splice(j,1);

                }

                break;

            }

        }


        if(b.life<=0){

            bullets.splice(i,1);

        }

    }

}


/* =========================
   UPDATE ENEMIES
========================= */

function updateEnemies(){

    for(let enemy of enemies){

        let dx=player.x-enemy.x;

        let dy=player.y-enemy.y;

        let distance=Math.hypot(dx,dy);


        if(distance>40){

            enemy.x+=(dx/distance)*enemy.speed;

            enemy.y+=(dy/distance)*enemy.speed;

        }


        if(distance<45){

            player.health-=0.12;

            document.getElementById(
                "hp"
            ).innerText=Math.max(
                0,
                Math.floor(player.health)
            );

        }

    }


    if(player.health<=0){

        gameOver();

    }

}


/* =========================
   SAFE ZONE
========================= */

function updateZone(){

    if(zone.radius>130){

        zone.radius-=0.015;

    }


    let distance=Math.hypot(

        player.x-zone.x,

        player.y-zone.y

    );


    if(distance>zone.radius){

        player.health-=0.05;

        document.getElementById(
            "hp"
        ).innerText=Math.max(
            0,
            Math.floor(player.health)
        );

    }

}


/* =========================
   PARTICLES
========================= */

function createExplosion(x,y){

    for(let i=0;i<12;i++){

        particles.push({

            x:x,

            y:y,

            dx:(Math.random()-.5)*6,

            dy:(Math.random()-.5)*6,

            life:30

        });

    }

}


function updateParticles(){

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];

        p.x+=p.dx;

        p.y+=p.dy;

        p.life--;

        if(p.life<=0){

            particles.splice(i,1);

        }

    }

}


/* =========================
   DRAW MAP
========================= */

function drawMap(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle="#18251b";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Grid */

    ctx.strokeStyle=
        "rgba(255,255,255,.04)";

    ctx.lineWidth=1;


    for(
        let x=0;
        x<canvas.width;
        x+=50
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,canvas.height);

        ctx.stroke();

    }


    for(
        let y=0;
        y<canvas.height;
        y+=50
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(canvas.width,y);

        ctx.stroke();

    }


    /* Safe zone */

    ctx.beginPath();

    ctx.arc(

        zone.x,

        zone.y,

        zone.radius,

        0,

        Math.PI*2

    );

    ctx.strokeStyle="#00e5ff";

    ctx.lineWidth=5;

    ctx.stroke();


    /* Outside zone */

    ctx.fillStyle=
        "rgba(100,0,0,.18)";

    ctx.beginPath();

    ctx.rect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.arc(

        zone.x,

        zone.y,

        zone.radius,

        0,

        Math.PI*2,

        true

    );

    ctx.fill();

}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(){

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.rotate(player.angle);


    /* Gun */

    ctx.fillStyle="#222";

    ctx.fillRect(
        5,
        -5,
        32,
        10
    );


    /* Body */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        player.radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#00e5ff";

    ctx.fill();


    ctx.restore();


    /* HP bar */

    ctx.fillStyle="#111";

    ctx.fillRect(
        player.x-25,
        player.y-35,
        50,
        6
    );


    ctx.fillStyle="#20e070";

    ctx.fillRect(
        player.x-25,
        player.y-35,
        50*(player.health/100),
        6
    );


    ctx.fillStyle="white";

    ctx.font="12px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "YOU",
        player.x,
        player.y+40
    );

}


/* =========================
   DRAW ENEMIES
========================= */

function drawEnemies(){

    for(let enemy of enemies){

        ctx.save();

        ctx.translate(
            enemy.x,
            enemy.y
        );


        let angle=Math.atan2(

            player.y-enemy.y,

            player.x-enemy.x

        );

        ctx.rotate(angle);


        /* Gun */

        ctx.fillStyle="#222";

        ctx.fillRect(
            5,
            -4,
            27,
            8
        );


        /* Enemy */

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            enemy.radius,
            0,
            Math.PI*2
        );

        ctx.fillStyle=enemy.color;

        ctx.fill();


        ctx.restore();


        /* Enemy HP */

        ctx.fillStyle="#111";

        ctx.fillRect(
            enemy.x-22,
            enemy.y-32,
            44,
            5
        );


        ctx.fillStyle="#ff5555";

        ctx.fillRect(
            enemy.x-22,
            enemy.y-32,
            44*(enemy.health/100),
            5
        );

    }

}


/* =========================
   DRAW BULLETS
========================= */

function drawBullets(){

    ctx.fillStyle="#ffe600";

    for(let b of bullets){

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================
   DRAW PARTICLES
========================= */

function drawParticles(){

    ctx.fillStyle="#ffcc00";

    for(let p of particles){

        ctx.globalAlpha=p.life/30;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    gameRunning=false;

    document.getElementById(
        "message"
    ).innerText=
        "💀 GAME OVER — KILLS: "+kills;

}


/* =========================
   WIN
========================= */

function checkWin(){

    if(enemies.length===0){

        gameRunning=false;

        document.getElementById(
            "message"
        ).innerText=
            "🏆 VICTORY! YOU WON!";

    }

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    if(!gameRunning)return;


    movePlayer();

    updateBullets();

    updateEnemies();

    updateZone();

    updateParticles();


    drawMap();

    drawBullets();

    drawEnemies();

    drawPlayer();

    drawParticles();


    document.getElementById(
        "enemyCount"
    ).innerText=enemies.length;


    checkWin();


    requestAnimationFrame(gameLoop);

}


/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{

    canvas.width=window.innerWidth;

    canvas.height=window.innerHeight;

});


</script>

</body>
</html>
